<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>天衡・更新預覽</title><style>html,body{margin:0;height:100%;background:#06060d}#thFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#06060d}.badge{position:fixed;z-index:99999;right:10px;top:max(10px,env(safe-area-inset-top));padding:7px 10px;border:1px solid rgba(217,182,106,.45);border-radius:999px;background:rgba(10,8,16,.82);color:#e4c980;font:11px/1.2 system-ui;backdrop-filter:blur(8px)}</style></head><body><div class="badge">更新預覽版</div><iframe id="thFrame" title="天衡更新預覽"></iframe><script>(function(){var f=document.getElementById('thFrame');var stamp=Date.now();f.src='./index.html?th_preview='+stamp;f.addEventListener('load',function(){try{var d=f.contentDocument,w=f.contentWindow;if(!d||!w)return;function inject(src,id){if(d.getElementById(id))return;var s=d.createElement('script');s.id=id;s.src=src+'?v='+stamp;s.async=false;d.head.appendChild(s)}/* 直接從同網域載入，不走 raw.githubusercontent.com */inject('./tianheng-v9-line.js','th-preview-v9');inject('./tianheng-v10-gates.js','th-preview-v10');/* 金流後台尚未完成，暫不載入 V11 付款模組 */var st=d.createElement('style');st.textContent='#support{display:block!important}';d.head.appendChild(st);}catch(e){console.error(e)}})})();</script></body></html>
