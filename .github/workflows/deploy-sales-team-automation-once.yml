name: Deploy Sales Team Automation Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-sales-team-automation-once.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 22bd6a71b50e9eeaa0daa802615a3459
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out sales-team production source
        uses: actions/checkout@v4
        with:
          repository: jacky95188888/sales-team
          ref: main

      - name: Validate automation source
        run: |
          node --check sales-team-worker.js
          node --check hq-patch.js
          node scripts/check-worker.mjs
          node scripts/test-hq-worker.mjs

      - name: Deploy Worker while preserving existing Secrets
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Verify cloud task API and existing AI route
        run: |
          set -euo pipefail
          base=https://sales-team.rhtm9y855y.workers.dev
          origin=https://jacky95188888.github.io
          workspace=smoke_0123456789abcdef0123456789abcdef

          task_status=$(curl --silent --show-error --output task.json --write-out '%{http_code}' \
            --header "Origin: $origin" --header 'Content-Type: application/json' \
            --data "{\"action\":\"list\",\"workspaceId\":\"$workspace\"}" \
            "$base/hq-tasks")
          test "$task_status" = "200"
          jq -e '.tasks | type == "array"' task.json >/dev/null

          ai_status=$(curl --silent --show-error --max-time 90 --output ai.json --write-out '%{http_code}' \
            --header "Origin: $origin" --header 'Content-Type: application/json' \
            --data '{"task":"部署連線測試：只回覆正常","profile":{"name":"系統測試"}}' \
            "$base/content")
          test "$ai_status" = "200"
          jq -e '(.content // "") | length > 0' ai.json >/dev/null
