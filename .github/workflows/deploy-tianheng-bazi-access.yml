name: Deploy Tianheng Bazi Access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tianheng-bazi-access-worker-v1.js
      - tianheng-bazi-access-wrangler.jsonc
      - tianheng-bazi-access-worker-tests-v1.js
      - .github/workflows/deploy-tianheng-bazi-access.yml

permissions:
  contents: read

concurrency:
  group: deploy-tianheng-bazi-access
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 22bd6a71b50e9eeaa0daa802615a3459
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run access regression tests
        run: |
          node tianheng-bazi-access-worker-tests-v1.js
          node tianheng-bazi-access-tests-v1.js

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Find or create BAZI_CODES namespace
        id: kv
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(npx wrangler kv namespace list)"
          KV_ID="$(printf '%s' "$LIST" | jq -r '.[] | select(.title == "tianheng-bazi-access-codes") | .id' | head -n 1)"
          if [ -z "$KV_ID" ]; then
            CREATE="$(npx wrangler kv namespace create tianheng-bazi-access-codes)"
            KV_ID="$(printf '%s' "$CREATE" | grep -Eo '[a-f0-9]{32}' | head -n 1)"
          fi
          test -n "$KV_ID"
          echo "kv_id=$KV_ID" >> "$GITHUB_OUTPUT"

      - name: Build deployment config
        env:
          KV_ID: ${{ steps.kv.outputs.kv_id }}
        run: |
          jq --arg id "$KV_ID" '.kv_namespaces[0].id = $id' tianheng-bazi-access-wrangler.jsonc > wrangler.deploy.json

      - name: Set Worker admin secret
        run: printf '%s' '${{ secrets.TIANHENG_BAZI_ADMIN_KEY }}' | npx wrangler secret put ADMIN_KEY --config wrangler.deploy.json

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.deploy.json
