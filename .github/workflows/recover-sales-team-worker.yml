name: Recover Sales Team Worker Source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-sales-team-worker.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 22bd6a71b50e9eeaa0daa802615a3459
      WORKER_NAME: sales-team
    steps:
      - name: Download deployed Worker source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          mkdir -p recovered-worker
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --dump-header recovered-worker/response-headers.txt \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/content" \
            --output recovered-worker/worker-response.bin
          test -s recovered-worker/worker-response.bin
          sha256sum recovered-worker/worker-response.bin > recovered-worker/sha256.txt
          sed -i '/^set-cookie:/Id;/^cf-ray:/Id' recovered-worker/response-headers.txt

      - name: Preserve recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-team-worker-source
          path: recovered-worker/
          if-no-files-found: error
          retention-days: 7
