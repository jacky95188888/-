name: Migrate Sales Team Worker Secret

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-sales-team-secret.yml

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 22bd6a71b50e9eeaa0daa802615a3459
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: sales-team
    steps:
      - name: Check out verified Worker source
        uses: actions/checkout@v4
        with:
          repository: jacky95188888/sales-team
          ref: main

      - name: Preserve the existing key and convert it to a Secret
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"

          settings_file=$(mktemp)
          secrets_file=$(mktemp)
          trap 'rm -f "$settings_file" "$secrets_file"' EXIT

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            --output "$settings_file"

          binding_type=$(jq -r '.result.bindings[]? | select(.name == "ANTHROPIC_KEY") | .type' "$settings_file")
          if [ "$binding_type" = "plain_text" ]; then
            anthropic_key=$(jq -r '.result.bindings[]? | select(.name == "ANTHROPIC_KEY" and .type == "plain_text") | .text' "$settings_file")
            test -n "$anthropic_key"
            test "$anthropic_key" != "null"
            echo "::add-mask::$anthropic_key"
            jq -n --arg value "$anthropic_key" '{ANTHROPIC_KEY: $value}' > "$secrets_file"
            npx --yes wrangler@4 deploy --config wrangler.jsonc --secrets-file "$secrets_file"
          elif [ "$binding_type" = "secret_text" ]; then
            npx --yes wrangler@4 deploy --config wrangler.jsonc
          else
            echo "ANTHROPIC_KEY binding is missing or has an unexpected type" >&2
            exit 1
          fi

      - name: Verify Secret binding and public endpoint
        run: |
          set -euo pipefail
          settings_file=$(mktemp)
          response_file=$(mktemp)
          trap 'rm -f "$settings_file" "$response_file"' EXIT

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            --output "$settings_file"
          jq -e '.result.bindings[]? | select(.name == "ANTHROPIC_KEY" and .type == "secret_text")' \
            "$settings_file" >/dev/null

          status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header 'Origin: https://jacky95188888.github.io' \
            https://sales-team.rhtm9y855y.workers.dev/monitor-notes)
          test "$status" = "200"
          jq -e 'has("notes")' "$response_file" >/dev/null
