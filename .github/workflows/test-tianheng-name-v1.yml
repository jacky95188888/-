name: Tianheng Name Engine v1
on:
  push:
    paths: ['tianheng-name-*.js','.github/workflows/test-tianheng-name-v1.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node tianheng-name-tests-v1.js
