name: Deploy Sales Team Video Pipeline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-sales-team-video.yml

permissions:
  contents: read

concurrency:
  group: sales-team-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4
        with:
          repository: jacky95188888/sales-team
          ref: main
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Worker source
        working-directory: app
        run: |
          node --check sales-team-worker.js
          node --check hq-patch.js
          node scripts/check-worker.mjs
          node scripts/test-hq-worker.mjs

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 22bd6a71b50e9eeaa0daa802615a3459
          wranglerVersion: "4"
          workingDirectory: app
          command: deploy --config wrangler.jsonc

      - name: Verify video API route
        run: |
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://jacky95188888.github.io' \
            --header 'Content-Type: application/json' \
            --data '{}' \
            https://sales-team.rhtm9y855y.workers.dev/video-config)
          test "$status" = "200"
          jq -e '.provider == "heygen" and (.ready | type == "boolean")' response.json >/dev/null
