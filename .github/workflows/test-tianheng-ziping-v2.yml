name: Test Tianheng Ziping Pattern v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'tianheng-ziping-pattern-v2.js'
      - 'tianheng-ziping-pattern-tests-v2.js'
      - 'tianheng-ziping-classics-v2.js'
      - 'tianheng-ziping-classics-tests-v2.js'
      - 'tianheng-ziping-qi-v2.js'
      - 'tianheng-ziping-qi-tests-v2.js'
      - 'tianheng-ziping-flow-v2.js'
      - 'tianheng-ziping-flow-tests-v2.js'
      - 'tianheng-ziping-fortune-v2.js'
      - 'tianheng-ziping-fortune-tests-v2.js'
      - 'tianheng-ziping-officer-kill-v2.js'
      - 'tianheng-ziping-officer-kill-tests-v2.js'
      - 'tianheng-ziping-fortune-combinations-v2.js'
      - 'tianheng-ziping-fortune-combinations-tests-v2.js'
      - 'tianheng-ziping-combination-effect-v2.js'
      - 'tianheng-ziping-combination-effect-tests-v2.js'
      - 'tianheng-ziping-advice-v2.js'
      - 'tianheng-ziping-advice-tests-v2.js'
      - 'tianheng-ziping-engine-v2.js'
      - 'tianheng-ziping-engine-tests-v2.js'
      - 'tianheng-ziping-integration-v2.js'
      - 'tianheng-ziping-integration-tests-v2.js'
      - 'tianheng-bazi-explanations-v2.js'
      - 'tianheng-bazi-explanations-tests-v2.js'
      - 'tianheng-bazi-yongshen-v3.js'
      - 'tianheng-bazi-yongshen-tests-v3.js'
      - 'tianheng-bazi-integration-v3.js'
      - 'tianheng-bazi-integration-tests-v3.js'
      - 'tianheng-bazi-yongshen-explanation-v3.js'
      - 'tianheng-bazi-yongshen-explanation-tests-v3.js'
      - 'tianheng-bazi-yongshen-fortune-v3.js'
      - 'tianheng-bazi-yongshen-fortune-explanation-v3.js'
      - 'tianheng-bazi-yongshen-fortune-tests-v3.js'
      - 'tianheng-bazi-decade-v4.js'
      - 'tianheng-bazi-decade-explanation-v4.js'
      - 'tianheng-bazi-decade-tests-v4.js'
      - 'tianheng-bazi-monthly-v5.js'
      - 'tianheng-bazi-monthly-explanation-v5.js'
      - 'tianheng-bazi-monthly-tests-v5.js'
      - 'tianheng-bazi-integration-v1.js'
      - 'index.html'
      - '.github/workflows/test-tianheng-ziping-v2.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Ziping pattern v2 regression tests
        run: node tianheng-ziping-pattern-tests-v2.js
      - name: Run verified classics case tests
        run: node tianheng-ziping-classics-tests-v2.js
      - name: Run qi-structure override tests
        run: node tianheng-ziping-qi-tests-v2.js
      - name: Run source-flow chain tests
        run: node tianheng-ziping-flow-tests-v2.js
      - name: Run fortune transition synthesis tests
        run: node tianheng-ziping-fortune-tests-v2.js
      - name: Run officer-kill purity tests
        run: node tianheng-ziping-officer-kill-tests-v2.js
      - name: Run fortune combination transition tests
        run: node tianheng-ziping-fortune-combinations-tests-v2.js
      - name: Run combination effect tests
        run: node tianheng-ziping-combination-effect-tests-v2.js
      - name: Run evidence-driven advice tests
        run: node tianheng-ziping-advice-tests-v2.js
      - name: Run Ziping v2 engine tests
        run: node tianheng-ziping-engine-tests-v2.js
      - name: Run side-by-side integration tests
        run: node tianheng-ziping-integration-tests-v2.js
      - name: Run complete explanation layer tests
        run: node tianheng-bazi-explanations-tests-v2.js
      - name: Run six-school useful-element arbitration tests
        run: node tianheng-bazi-yongshen-tests-v3.js
      - name: Run v3 side-by-side integration tests
        run: node tianheng-bazi-integration-tests-v3.js
      - name: Run v3 useful-element explanation tests
        run: node tianheng-bazi-yongshen-explanation-tests-v3.js
      - name: Run v3 useful-element fortune activation tests
        run: node tianheng-bazi-yongshen-fortune-tests-v3.js
      - name: Run v4 decade timeline tests
        run: node tianheng-bazi-decade-tests-v4.js
      - name: Run v5 monthly activation tests
        run: node tianheng-bazi-monthly-tests-v5.js
