<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天衡・九維取名</title><link rel="stylesheet" href="tianheng-name-ui-v1.css"></head><body><main class="wrap"><header><div class="eyebrow">TIANHENG NINE-DIMENSION NAMING</div><h1>九 維 取 名</h1><p class="muted">命局為骨架，字義、聲韻與實用性共同裁決；五格只作輔助。</p></header><nav class="nav"><a href="./">返回天衡</a><a href="tianheng-rename-v1.html">已有名字・改名比較</a></nav><section class="card"><h2>輸入命名資料</h2><div class="grid"><label>姓氏<input id="surname" maxlength="2" value="羅"></label><label>避用字<input id="avoid" placeholder="例如：豪、婷"></label></div><h3>四柱干支</h3><div id="pillars" class="grid"></div><button id="run">產 生 九 維 候 選 名 字</button><p class="muted">目前以人工核對干支作為 QA 輸入；正式串接後會直接承接主命盤四柱。</p></section><section id="result" aria-live="polite"></section></main>
<script src="tianheng-bazi-advanced-v1.js"></script><script src="tianheng-bazi-combinations-v1.js"></script><script src="tianheng-bazi-geju-tiaohou-v1.js"></script><script src="tianheng-bazi-quality-v1.js"></script><script src="tianheng-bazi-engine-v1.js"></script><script src="tianheng-name-data-v1.js"></script><script src="tianheng-name-engine-v1.js"></script><script>
const G='甲乙丙丁戊己庚辛壬癸',Z='子丑寅卯辰巳午未申酉戌亥',defaults=[['己','丑'],['己','丑'],['庚','午'],['甲','寅']],labels=['年柱','月柱','日柱','時柱'];
document.getElementById('pillars').innerHTML=labels.map((x,i)=>`<label>${x}<span style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><select data-g>${[...G].map(v=>`<option ${v===defaults[i][0]?'selected':''}>${v}</option>`).join('')}</select><select data-z>${[...Z].map(v=>`<option ${v===defaults[i][1]?'selected':''}>${v}</option>`).join('')}</select></span></label>`).join('');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function getP(){return [...document.querySelectorAll('[data-g]')].map((x,i)=>({gan:x.value,zhi:document.querySelectorAll('[data-z]')[i].value}))}function card(x){return `<article class="candidate"><div><span class="name">${esc(x.fullName)}</span> <span class="score">${x.overall}</span></div><div>${x.characters.map(c=>`<span class="pill">${c.char}・${c.element}・${c.stroke}畫</span>`).join('')}</div><p>${x.characters.map(c=>`${c.char}：${esc(c.meaning)}`).join('；')}</p><div class="dims">${Object.entries(x.dimensions).map(([k,v])=>`<div class="dim">${k}<b>${v===null?'待核':v}</b></div>`).join('')}</div><p class="good">依據：${x.evidence.map(esc).join('；')}</p><p class="warn">${x.warnings.map(esc).join('；')}</p></article>`}document.getElementById('run').onclick=()=>{const r=TianhengNameEngine.safeGenerate({surname:document.getElementById('surname').value,avoidChars:document.getElementById('avoid').value,pillars:getP(),limit:10});document.getElementById('result').innerHTML=r.ok?`<section class="card"><h2>命名策略</h2><p>日主 ${r.data.strategy.dayMaster}・${r.data.strategy.strength}・通根 ${r.data.strategy.rootScore} 分</p><p>月令格局：${r.data.strategy.pattern}；氣候：${r.data.strategy.climate||'待定'}；優先五行：${r.data.strategy.preferred.join('、')}</p></section><section class="card"><h2>候選名字</h2>${r.data.candidates.map(card).join('')}<p class="muted">${r.data.disclaimer}</p></section>`:`<section class="card warn">${esc(r.error)}</section>`;document.getElementById('result').scrollIntoView({behavior:'smooth'})};
</script></body></html>
