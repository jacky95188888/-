<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>天衡・即時新版預覽</title><style>html,body{margin:0;height:100%;background:#06060d}#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#06060d}.status{position:fixed;z-index:99999;top:max(10px,env(safe-area-inset-top));right:10px;max-width:70vw;padding:8px 11px;border:1px solid rgba(217,182,106,.45);border-radius:999px;background:rgba(8,6,13,.9);color:#e7ca81;font:11px/1.35 system-ui;backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.35)}.status.ok{border-color:rgba(73,194,116,.55);color:#a9e1bb}</style></head><body><div class="status" id="status">正在清除舊快取…</div><iframe id="frame" title="天衡即時新版"></iframe><script>(async function(){var st=document.getElementById('status'),f=document.getElementById('frame'),stamp=Date.now();try{if('serviceWorker'in navigator){var regs=await navigator.serviceWorker.getRegistrations();for(var r of regs){if(r.scope.indexOf('/-/')!==-1)await r.unregister();}}if('caches'in window){var ks=await caches.keys();for(var k of ks)await caches.delete(k);}st.textContent='載入最新正式頁…';}catch(e){st.textContent='載入最新正式頁…';}f.src='./index.html?preview_live='+stamp;f.addEventListener('load',function(){var d=f.contentDocument;if(!d){st.textContent='無法讀取預覽頁';return;}function load(src,id){return new Promise(function(resolve){if(d.getElementById(id))return resolve();var s=d.createElement('script');s.id=id;s.src=src+'?fresh='+stamp;s.onload=resolve;s.onerror=resolve;d.head.appendChild(s);});}(async function(){st.textContent='載入 LINE 新入口…';await load('./tianheng-v9-line.js','live-v9');st.textContent='載入四大命書入口…';await load('./tianheng-v10-gates.js','live-v10');var style=d.createElement('style');style.textContent='#support{display:block!important}';d.head.appendChild(style);st.textContent='新版已載入・請先啟盤再往下滑';st.classList.add('ok');})();});})();</script></body></html>
