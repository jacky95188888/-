<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>天衡｜四柱八字專業排盤</title><link rel="icon" href="./tianheng-icon.svg"><style>
:root{--bg:#09070e;--card:#15101d;--line:#6d5733;--gold:#e5c474;--text:#eee4d4;--muted:#a99b88;--wood:#66ad7c;--fire:#d96858;--earth:#c69a55;--metal:#d5d2c9;--water:#658cc8}*{box-sizing:border-box}body{margin:0;background:#07060b url('./BCCCDAF2-C8F0-45EB-88A4-00BE9C598ABE.png') center top/cover fixed;color:var(--text);font-family:"Noto Serif TC","PingFang TC",serif}.wrap{max-width:860px;margin:auto;padding:18px 14px 70px}.back{color:#d8bd79;text-decoration:none}.hero{text-align:center;padding:36px 12px 24px}.hero small{letter-spacing:.35em;color:#a68b57}.hero h1{margin:9px 0;font-size:34px;color:var(--gold)}.hero p{color:var(--muted);line-height:1.8}.panel{margin:14px 0;padding:20px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(29,20,39,.96),rgba(8,7,13,.96));box-shadow:0 18px 50px #0008}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;color:#cbb98f;font-size:13px}input,select,button{width:100%;margin-top:7px;padding:14px;border:1px solid #6b5938;border-radius:13px;background:#0d0a12;color:#f5ecdd;font-size:16px}button{background:linear-gradient(120deg,#76512e,#9b593d);color:#fff4d2;font-weight:700}.notice{margin-top:12px;color:#938675;font-size:12px;line-height:1.8}.hidden{display:none}.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pillar{text-align:center;padding:14px 6px;border:1px solid #655132;border-radius:16px;background:#0d0a12}.pillar small{color:#a79576}.pillar b{display:block;margin:10px 0 4px;color:var(--gold);font-size:28px}.pillar em{font-style:normal;color:#b9aa94;font-size:11px}.hidden-stems{margin-top:8px;font-size:11px;color:#9f917e;line-height:1.7}.bars{display:grid;gap:10px}.bar{display:grid;grid-template-columns:30px 1fr 42px;gap:8px;align-items:center}.track{height:9px;border-radius:9px;background:#211b27;overflow:hidden}.fill{height:100%;border-radius:9px}.decision{padding:18px;border-left:4px solid var(--gold);background:#110d17;border-radius:12px}.decision b{display:block;color:var(--gold);font-size:22px}.dayun{display:flex;gap:9px;overflow-x:auto;padding:4px 0 10px}.yun{min-width:98px;padding:12px 8px;border:1px solid #665233;border-radius:14px;background:#0c0910;color:#d9c8a9}.yun.active{border-color:#e5c474;background:#2a1c2c}.yun strong{display:block;font-size:20px;color:#e7cc88}.explain{line-height:1.95;color:#d7cbbb}.evidence{color:#918574;font-size:12px}.section-title{color:#e3c577;letter-spacing:.15em}.tag{display:inline-block;margin:3px;padding:4px 9px;border:1px solid #6d5733;border-radius:99px;color:#ccb47b;font-size:11px}@media(max-width:560px){.grid{grid-template-columns:1fr}.pillars{gap:5px}.pillar{padding:12px 3px}.pillar b{font-size:22px}.hero h1{font-size:29px}}
</style></head><body><main class="wrap"><a class="back" href="./?v=20260908-bazi-chart1">‹ 返回天衡主頁</a><header class="hero"><small>TIANHENG BAZI MATRIX</small><h1>四柱八字・專業排盤</h1><p>先排出可以核對的四柱，再分層解讀十神、藏干、旺衰與大運。原始命盤與說明分開保存。</p></header>
<section class="panel"><h2 class="section-title">輸入出生資料</h2><div class="grid"><label>出生日期（國曆）<input id="birth" type="date" min="1901-01-01"></label><label>出生時間<input id="time" type="time" value="12:00"></label><label>性別<select id="sex"><option>男</option><option>女</option></select></label><label>子時換日<select id="zi"><option value="late">晚子時算隔日</option><option value="none">晚子時仍算當日</option></select></label></div><div class="notice">目前專業排盤以台灣時區 UTC+8 與國曆輸入。若只知道農曆，請先在天衡主頁轉換；下一階段會把農曆與出生地真太陽時直接整合進此頁。</div><button id="go">開始專業排盤與解盤</button><div id="error" class="notice"></div></section>
<section id="result" class="hidden"><div class="panel"><h2 class="section-title">四柱命盤</h2><div id="pillars" class="pillars"></div></div><div class="panel"><h2 class="section-title">日主與五行</h2><div id="decision" class="decision"></div><div id="bars" class="bars" style="margin-top:18px"></div></div><div class="panel"><h2 class="section-title">格局與調候</h2><div id="advanced" class="explain"></div></div><div class="panel"><h2 class="section-title">十年大運</h2><div id="yunMeta" class="notice"></div><div id="dayun" class="dayun"></div><div id="yunExplain" class="explain"></div></div><div class="panel"><h2 class="section-title">分層解盤</h2><div id="reading" class="explain"></div><details><summary class="evidence">查看專業判斷依據</summary><div id="evidence" class="evidence"></div></details></div></section></main><script src="./tianheng-bazi-chart-v1.js?v=20260908-chart1"></script><script src="./tianheng-bazi-advanced-v1.js?v=20260908-chart1"></script><script src="./tianheng-bazi-combinations-v1.js?v=20260908-chart1"></script><script src="./tianheng-bazi-geju-tiaohou-v1.js?v=20260908-chart1"></script><script src="./tianheng-bazi-quality-v1.js?v=20260908-chart1"></script><script src="./tianheng-bazi-engine-v1.js?v=20260908-chart1"></script><script>
(()=>{'use strict';const $=x=>document.getElementById(x),color={木:'var(--wood)',火:'var(--fire)',土:'var(--earth)',金:'var(--metal)',水:'var(--water)'},esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let last=null;
function explainYun(y,r){const god=TianhengBaziChartV1.tenGod(r.pillars[2].gan,y.gan),same=r.strength.counts[y.gan]||0;return`所選大運為 <b>${y.gan}${y.zhi}</b>，天干對日主形成「${god}」。這十年應先看它是否補足命局需要，再看流年是否引動；不可只憑一個十神直接判吉凶。起始約為 ${y.startYear} 年（${y.startAge} 歲）。`}
function render(r){last=r;$('pillars').innerHTML=r.details.map(p=>`<article class="pillar"><small>${p.label}</small><b>${p.gan}${p.zhi}</b><em>${p.tenGod}・${p.ganElement}/${p.zhiElement}</em><div class="hidden-stems">藏干 ${p.hidden.map(x=>x.gan+' '+x.tenGod).join('・')}</div></article>`).join('');const d=r.details[2],s=r.strength,adv=TianhengBaziEngine.safeAnalyze(r.pillars);$('decision').innerHTML=`<b>日主 ${d.gan}${d.ganElement}・${s.label}</b><p>扶助比例 ${(s.ratio*100).toFixed(1)}%。此數字只呈現本盤五行扶抑結構，不等於人生能力或命運分數。</p>`;const max=Math.max(...Object.values(s.counts));$('bars').innerHTML=Object.entries(s.counts).map(([k,v])=>`<div class="bar"><b style="color:${color[k]}">${k}</b><div class="track"><div class="fill" style="width:${v/max*100}%;background:${color[k]}"></div></div><span>${v.toFixed(1)}</span></div>`).join('');if(adv.ok){const a=adv.data,g=a.geJu,t=a.tiaoHou,q=a.quality;$('advanced').innerHTML=`<div class="decision"><b>${esc(g.geJu)}・${esc(q.gaoDiPingJi)}</b><p>月令 ${esc(g.yueLingDiZhi)}，格神 ${esc(g.shiShen||'待定')}；規格化查核分 ${esc(q.xiuZhengHouFen)}。分數只供結構一致性檢查，不代表人生高低。</p></div><h3>調候</h3><p>${esc(t.desc)}。需要：${esc(t.tiaohouXuqiu.join('、')||'依格局而定')}；已具備：${esc(t.yiJuBei.join('、')||'未見')}；缺少：${esc(t.queShi.join('、')||'無')}。</p><p>${t.yongShenChongTu?'調候與身強弱取向有衝突，兩套判斷並列，不直接合成吉凶。':'目前未偵測到調候與身強弱取向衝突。'}</p>`}else{$('advanced').innerHTML='<p>進階格局模組未完成判讀，請以四柱原盤人工核對。</p>'}$('yunMeta').textContent=`${r.dayun.direction}・約 ${r.dayun.startAge} 歲 ${r.dayun.startMonth} 個月起運；節氣交界出生者建議人工核盤。`;$('dayun').innerHTML=r.dayun.list.map((y,i)=>`<button class="yun ${i===0?'active':''}" data-i="${i}"><small>${y.startAge}歲</small><strong>${y.gan}${y.zhi}</strong><small>${y.startYear}</small></button>`).join('');$('yunExplain').innerHTML=explainYun(r.dayun.list[0],r);$('dayun').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('dayun').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));$('yunExplain').innerHTML=explainYun(r.dayun.list[+b.dataset.i],r)});const dominant=Object.entries(s.counts).sort((a,b)=>b[1]-a[1])[0][0];$('reading').innerHTML=`<h3>一、命局骨架</h3><p>月柱為 ${r.pillars[1].gan}${r.pillars[1].zhi}，日主為 ${d.gan}${d.ganElement}。目前結構判為「${s.label}」，五行以${dominant}較突出。這是分析起點，不以單一旺衰決定全部人生。</p><h3>二、十神配置</h3><p>${r.details.map(p=>p.label+'天干為'+p.tenGod).join('；')}。藏干另列於四柱下方，用來辨識沒有透出、但在特定大運流年可能被引動的力量。</p><h3>三、大運使用方式</h3><p>大運是十年環境主軸，不是十年固定答案。點選上方每一步大運，可查看它與日主的關係；實際事件仍須再配合流年、職業與當事人的真實處境。</p>`;$('evidence').innerHTML=`<p>排盤：節氣換月、立春換年、五鼠遁時干、台灣 UTC+8。</p><p>旺衰：四柱天干與藏干權重扶抑比例；進階層另保留通根、合會局、格局、調候與破格查核，不互相覆蓋。</p><p>大運：依年干陰陽與性別判順逆，以出生時刻到前後節的天數除三估算起運。</p>`;$('result').classList.remove('hidden');$('result').scrollIntoView({behavior:'smooth'})}
$('go').onclick=()=>{try{const date=$('birth').value,time=$('time').value;if(!date||!time)throw Error('請完整輸入出生日期與時間');const [year,month,day]=date.split('-').map(Number),[hour,minute]=time.split(':').map(Number);render(TianhengBaziChartV1.analyze({year,month,day,hour,minute,sex:$('sex').value,ziSchool:$('zi').value}))}catch(e){$('error').textContent=e.message}};
})();</script><script src="./tianheng-support-v1.js?v=20260902"></script></body></html>
