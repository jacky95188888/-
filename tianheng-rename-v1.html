<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天衡・九維改名比較</title><link rel="stylesheet" href="tianheng-name-ui-v1.css"></head><body><main class="wrap"><header><div class="eyebrow">ORIGINAL NAME PRESERVED</div><h1>改 名 比 較</h1><p class="muted">原名與候選名分開保存，呈現改善、代價與無法判定之處。</p></header><nav class="nav"><a href="./">返回天衡</a><a href="tianheng-name-v1.html">尚未取名・候選生成</a></nav><section class="card"><div class="grid"><label>姓氏<input id="surname" value="羅"></label><label>原本名字<input id="old" value="誠宇" maxlength="2"></label><label>候選新名<input id="neo" value="景安" maxlength="2"></label></div><h3>四柱干支</h3><div id="pillars" class="grid"></div><button id="run">比 較 原 名 與 候 選 名</button></section><section id="result" aria-live="polite"></section></main><script src="tianheng-bazi-advanced-v1.js"></script><script src="tianheng-bazi-combinations-v1.js"></script><script src="tianheng-bazi-geju-tiaohou-v1.js"></script><script src="tianheng-bazi-quality-v1.js"></script><script src="tianheng-bazi-engine-v1.js"></script><script src="tianheng-name-data-v1.js"></script><script src="tianheng-name-engine-v1.js"></script><script>
const G='甲乙丙丁戊己庚辛壬癸',Z='子丑寅卯辰巳午未申酉戌亥',D=[['己','丑'],['己','丑'],['庚','午'],['甲','寅']],L=['年柱','月柱','日柱','時柱'];document.getElementById('pillars').innerHTML=L.map((x,i)=>`<label>${x}<span style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><select data-g>${[...G].map(v=>`<option ${v===D[i][0]?'selected':''}>${v}</option>`).join('')}</select><select data-z>${[...Z].map(v=>`<option ${v===D[i][1]?'selected':''}>${v}</option>`).join('')}</select></span></label>`).join('');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function p(){return [...document.querySelectorAll('[data-g]')].map((x,i)=>({gan:x.value,zhi:document.querySelectorAll('[data-z]')[i].value}))}function one(x,title){if(x.overall===null)return `<div><h3>${title}｜${esc(x.fullName)}</h3><p class="warn">${esc(x.warnings[0])}</p></div>`;return `<div><h3>${title}｜${esc(x.fullName)}</h3><div class="score">${x.overall}</div><div class="dims">${Object.entries(x.dimensions).map(([k,v])=>`<div class="dim">${k}<b>${v===null?'待核':v}</b></div>`).join('')}</div></div>`}document.getElementById('run').onclick=()=>{const r=TianhengNameEngine.safeCompareRename({surname:surname.value,oldGivenName:old.value,newGivenName:neo.value,pillars:p()});result.innerHTML=r.ok?`<section class="card"><div class="grid">${one(r.data.original,'原名')}${one(r.data.candidate,'候選名')}</div><h2>差異判讀</h2><p class="score">${r.data.delta===null?'資料不足':(r.data.delta>=0?'+':'')+r.data.delta}</p><p class="good">改善：${r.data.improvements.length?r.data.improvements.map(esc).join('；'):'沒有足夠證據宣稱改善'}</p><p class="warn">取捨：${r.data.tradeoffs.map(esc).join('；')}</p><p class="muted">${r.data.disclaimer}</p></section>`:`<section class="card warn">${esc(r.error)}</section>`;result.scrollIntoView({behavior:'smooth'})};
</script><script src="./tianheng-support-v1.js?v=20260902"></script></body></html>
