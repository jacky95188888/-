<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>天衡・進階功能發碼後台</title>
  <link rel="icon" type="image/svg+xml" href="./tianheng-icon.svg?v=20260903">
  <style>
    :root{color-scheme:dark;--gold:#dfbd70;--line:rgba(223,189,112,.35);--muted:#aa9c86;--green:#76b894;--red:#d27a78}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#2c1832 0,transparent 38%),#08060c;color:#eee4d4;font-family:"Noto Serif TC","PingFang TC",serif}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:38px 0 80px}header{text-align:center;margin-bottom:24px}h1{margin:7px 0;color:#f1d58f;font-size:28px;letter-spacing:.12em}header p{color:var(--muted);line-height:1.7}.card{padding:22px;margin:14px 0;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(27,18,35,.96),rgba(12,10,16,.96));box-shadow:0 18px 50px rgba(0,0,0,.3)}label{display:block;color:#d5be8e;margin:12px 0 7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select,button{width:100%;min-height:48px;border-radius:12px;font:inherit}input,select{border:1px solid rgba(223,189,112,.3);background:#0b0910;color:#fff;padding:0 13px}button{border:1px solid var(--gold);background:linear-gradient(135deg,#8c372d,#55202a);color:#fff0c5;font-weight:700;letter-spacing:.1em;cursor:pointer}.secondary{background:#17131d;color:#d9c8a5}.status{min-height:24px;margin-top:12px;color:var(--muted)}.codes{display:grid;gap:10px;margin-top:15px}.code,.row{padding:14px;border:1px solid rgba(223,189,112,.2);border-radius:12px;background:#0c0911}.code b{display:block;color:#f3d784;font:700 18px ui-monospace,monospace;letter-spacing:.06em}.code small,.row small{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row button{width:auto;min-height:36px;padding:0 12px;font-size:12px}.feature{display:inline-block;margin-right:6px;padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:#e5c77f;font-size:10px}.active{color:var(--green)}.redeemed{color:var(--gold)}.revoked{color:var(--red)}.warning{color:#d9b6a8;font-size:12px;line-height:1.7}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding-top:22px}.card{padding:18px}}
  </style>
</head>
<body>
<main class="wrap">
  <header><div>TIANHENG PRIVATE CONSOLE</div><h1>天衡進階功能發碼後台</h1><p>收到轉帳截圖後，先選功能，再產生一碼一裝置的專屬解鎖碼。</p></header>
  <section class="card">
    <label for="key">後台管理金鑰</label><input id="key" type="password" autocomplete="off" placeholder="輸入 ADMIN_KEY">
    <p class="warning">金鑰只用於本次請求，不會保存在此頁或瀏覽器。此後台連結與管理金鑰請勿交給客人。</p>
    <label for="feature">開通功能</label><select id="feature"><option value="bazi">八字進階分析</option><option value="wenshi">六爻問事</option><option value="meihua">梅花易數</option></select>
    <div class="grid"><div><label for="count">產生數量</label><input id="count" type="number" min="1" max="50" value="1"></div><div><label for="days">有效天數</label><input id="days" type="number" min="1" max="365" value="30"></div></div>
    <label for="label">備註（例如客人稱呼或轉帳日期）</label><input id="label" maxlength="80" placeholder="只填方便辨識的備註，避免敏感資料">
    <div class="grid" style="margin-top:16px"><button id="create">產 生 解 鎖 碼</button><button id="refresh" class="secondary">更 新 紀 錄</button></div>
    <div id="status" class="status" aria-live="polite"></div><div id="codes" class="codes"></div>
  </section>
  <section class="card"><h2>近期發碼紀錄</h2><div id="records" class="codes"><small>輸入管理金鑰後按「更新紀錄」。</small></div></section>
</main>
<script>
(function(){'use strict';
  var API='https://tianheng-bazi-access.rhtm9y855y.workers.dev';
  var featureLabels={bazi:'八字進階',wenshi:'六爻問事',meihua:'梅花易數'};
  var $=function(id){return document.getElementById(id)},status=$('status');
  async function call(path,options){var key=$('key').value.trim();if(!key)throw new Error('請先輸入後台管理金鑰。');var response=await fetch(API+path,Object.assign({},options||{},{headers:Object.assign({'X-Admin-Key':key,'Content-Type':'application/json'},options&&options.headers||{})}));var data=await response.json().catch(function(){return {ok:false}});if(!response.ok||!data.ok)throw new Error(data.error==='unauthorized'?'管理金鑰不正確。':data.error==='invalid_feature'?'請選擇正確的開通功能。':'操作失敗，請稍後再試。');return data}
  function date(value){return value?new Date(value).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'—'}
  function esc(value){var d=document.createElement('div');d.textContent=String(value||'');return d.innerHTML}
  $('create').onclick=async function(){status.textContent='產生中…';$('codes').innerHTML='';try{var data=await call('/admin/create',{method:'POST',body:JSON.stringify({feature:$('feature').value,count:Number($('count').value),days:Number($('days').value),label:$('label').value.trim()})});$('codes').innerHTML=data.codes.map(function(x){return '<div class="code"><span class="feature">'+esc(featureLabels[x.feature]||x.feature)+'</span><b>'+esc(x.code)+'</b><small>有效至 '+date(x.expiresAt)+'・請立即複製交給客人</small></div>'}).join('');status.textContent='已產生 '+data.codes.length+' 組解鎖碼。這是唯一顯示完整碼的畫面。';await load()}catch(e){status.textContent=e.message}};
  async function load(){var data=await call('/admin/list');$('records').innerHTML=data.records.length?data.records.map(function(x){return '<div class="row"><div><span class="feature">'+esc(featureLabels[x.feature]||x.feature)+'</span><b class="'+esc(x.status)+'">'+esc(x.status)+'</b>　'+esc(x.label||x.id)+'<br><small>建立 '+date(x.createdAt)+'・到期 '+date(x.expiresAt)+'</small></div>'+(x.status!=='revoked'?'<button data-revoke="'+esc(x.hash)+'">停用</button>':'')+'</div>'}).join(''):'<small>目前沒有紀錄。</small>';document.querySelectorAll('[data-revoke]').forEach(function(btn){btn.onclick=async function(){if(!confirm('確定停用這組解鎖碼？'))return;try{await call('/admin/revoke',{method:'POST',body:JSON.stringify({hash:btn.dataset.revoke})});status.textContent='解鎖碼已停用。';await load()}catch(e){status.textContent=e.message}}})}
  $('refresh').onclick=function(){status.textContent='讀取中…';load().then(function(){status.textContent='紀錄已更新。'}).catch(function(e){status.textContent=e.message})};
})();
</script>
</body>
</html>
