<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>工具瀏覽統計</title><style>
:root{--bg:#102019;--panel:#182c24;--panel2:#20382e;--line:#315246;--gold:#d3b24b;--gold2:#f0d879;--text:#f7f2df;--sub:#9eb5aa;--ok:#69d0a2;--warn:#e3b76b;--shadow:0 18px 45px rgba(0,0,0,.22)}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:radial-gradient(1000px 500px at 50% -140px,rgba(211,178,75,.20),transparent 60%),linear-gradient(180deg,#12241c,#0e1a16 70%);color:var(--text);min-height:100vh;padding:22px 16px 64px}.wrap{width:min(1100px,100%);margin:auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:8px 0 18px}.eyebrow{font-size:11px;letter-spacing:4px;color:var(--gold);font-weight:800}.top h1{margin:7px 0 5px;font-size:clamp(28px,6vw,44px);line-height:1.05}.sub{color:var(--sub);font-size:13px}.home{flex:none;text-decoration:none;color:var(--gold2);border:1px solid var(--gold);border-radius:12px;padding:9px 13px;font-size:13px}.hero{background:linear-gradient(145deg,rgba(34,60,49,.96),rgba(24,44,36,.96));border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}.hero-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:rgba(10,24,18,.35);border:1px solid rgba(211,178,75,.17);border-radius:16px;padding:15px}.metric .label{color:var(--sub);font-size:12px}.metric .num{font-size:34px;font-weight:900;color:var(--gold2);margin-top:4px;font-variant-numeric:tabular-nums}.metric .num small{font-size:12px;color:var(--sub);font-weight:600}.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 2px 12px}.section-title h2{margin:0;font-size:20px}.section-title span{font-size:12px;color:var(--sub)}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.tool{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:190px}.tool-top{display:flex;gap:12px;align-items:center}.icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(211,178,75,.13);border:1px solid rgba(211,178,75,.35);font-size:24px}.tool h3{margin:0;font-size:17px}.tag{display:inline-block;color:var(--ok);font-size:11px;margin-top:3px}.tool p{font-size:13px;line-height:1.65;color:var(--sub);margin:12px 0 16px}.actions{display:flex;gap:8px;margin-top:auto}.actions a,.actions span{flex:1;text-align:center;text-decoration:none;border-radius:11px;padding:10px 8px;font-size:12px;font-weight:800}.primary{background:var(--gold);color:#172219;border:1px solid var(--gold)}.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line)}.disabled{opacity:.45;pointer-events:none}.stats-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow)}.box h3{margin:0 0 14px;font-size:15px}.bars{display:flex;align-items:flex-end;gap:5px;height:180px;padding-top:22px}.bar-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}.bar{width:100%;min-height:3px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--gold2),#a6832c);position:relative}.v{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--gold2);font-weight:800}.bar-label{font-size:8px;color:var(--sub);white-space:nowrap}.frow{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid var(--line);padding:10px 0;font-size:13px}.frow:last-child{border:0}.frow span{color:var(--gold2);font-weight:800}.rate{font-size:10px;color:var(--sub);margin-left:4px}.state{color:var(--sub);font-size:13px;padding:20px 0}.notice{margin-top:12px;padding:11px 12px;border:1px solid rgba(227,183,107,.28);border-radius:12px;color:var(--warn);font-size:12px;line-height:1.65;background:rgba(227,183,107,.05)}.refresh{display:block;margin:24px auto 0;background:transparent;border:1px solid var(--gold);color:var(--gold2);font-size:13px;font-weight:800;padding:10px 24px;border-radius:12px}.foot{text-align:center;color:#657d72;font-size:11px;margin-top:28px}@media(max-width:850px){.hero-grid{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr 1fr}.stats-grid{grid-template-columns:1fr}}@media(max-width:560px){body{padding:18px 12px 48px}.home{padding:8px 10px;font-size:11px}.hero{padding:14px;border-radius:18px}.hero-grid{gap:8px}.metric{padding:12px;border-radius:13px}.metric .num{font-size:27px}.tools{grid-template-columns:1fr}.tool{min-height:auto}.section-title{align-items:flex-start;flex-direction:column;gap:3px}.bars{gap:3px}.bar-label{font-size:7px}}

a:focus-visible,button:focus-visible{outline:3px solid var(--gold2);outline-offset:4px}.actions a{min-height:44px}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summary .metric{min-width:0}.summary .num{font-size:clamp(23px,5vw,34px);overflow-wrap:anywhere}.chooser{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.chooser a{color:var(--gold2);border:1px solid var(--line);border-radius:10px;padding:11px;text-decoration:none;font-size:14px}.chooser a[aria-current]{background:var(--gold);color:var(--bg)}.bars-scroll{overflow-x:auto;padding:22px 0 4px}.bars{min-width:540px;height:220px}.bar-label{font-size:11px}.v{font-size:12px}.metric .label,.sub,.state,.notice{font-size:14px}.notice{line-height:1.7}.box{margin-top:14px}.frow{overflow-wrap:anywhere}.refresh{min-height:44px;cursor:pointer}.bar{flex-shrink:1}button:disabled{opacity:.5}h1{overflow-wrap:anywhere}@media(max-width:560px){.summary{gap:6px}.summary .metric{padding:10px}.summary .label{font-size:13px}}
</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">TOOL ANALYTICS</div><h1 id="title">工具瀏覽統計</h1><p class="sub" id="status" role="status" aria-live="polite">讀取中…</p></div><a class="home" href="./admin.html">回總控台</a></div><nav class="chooser" aria-label="切換工具" id="chooser"></nav><section id="results" aria-busy="true"></section><button class="refresh" id="refresh" type="button">重新整理</button><p class="notice">瀏覽數是頁面載入次數，不代表不重複人數。統計使用台灣時間；管理頁、示範頁與測試頁不計入新版計數。新接入工具不包含啟用前的瀏覽。資料同步可能稍有延遲。</p></main><script type="module" src="./tool-analytics-dashboard.js?v=20261016"></script></body></html>
