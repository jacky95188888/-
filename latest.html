<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天衡・最新預覽</title><style>html,body{margin:0;background:#06060d;color:#e8d9b6;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.spin{width:34px;height:34px;border:2px solid rgba(217,182,106,.25);border-top-color:#d9b66a;border-radius:50%;animation:r 1s linear infinite;margin:0 auto 14px}@keyframes r{to{transform:rotate(360deg)}}small{color:#9d9079}</style></head><body><div id="boot"><div><div class="spin"></div><div>正在載入天衡最新更新版</div><small>強制略過舊快取</small></div></div><script>(async()=>{try{const v=Date.now();const r=await fetch('https://raw.githubusercontent.com/jacky95188888/-/main/index.html?ts='+v,{cache:'no-store'});if(!r.ok)throw new Error('index '+r.status);let h=await r.text();const loader='<script src="https://raw.githubusercontent.com/jacky95188888/-/main/tianheng-v3.js?ts='+v+'"><\/script>';h=h.replace(/<\/body>/i,loader+'</body>');document.open();document.write(h);document.close();}catch(e){document.getElementById('boot').innerHTML='<div>最新預覽載入失敗<br><small>'+String(e.message||e)+'</small><br><br><a style="color:#e3c675" href="./index.html?fresh='+Date.now()+'">改開正式頁</a></div>';}})();</script></body></html>
